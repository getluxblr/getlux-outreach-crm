<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Getlux Outreach CRM — Live Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --border:#e2e6ec; --text:#1a2233; --muted:#6b7688;
    --accent:#2f6feb; --accent-ink:#ffffff;
    --green:#16a34a; --green-bg:#e8f8ee;
    --blue:#2563eb; --blue-bg:#eaf1ff;
    --amber:#d97706; --amber-bg:#fff6e5;
    --red:#dc2626; --red-bg:#fdeaea;
    --radius:10px;
  }
  [data-theme="dark"]{
    --bg:#0f1420; --panel:#161c2b; --border:#28304a; --text:#e7ebf5; --muted:#93a0bd;
    --accent:#5b8def; --accent-ink:#08101f;
    --green:#34d17c; --green-bg:#0f2a1c;
    --blue:#6ea8ff; --blue-bg:#0f1e3a;
    --amber:#f2b74e; --amber-bg:#332405;
    --red:#ff6b6b; --red-bg:#33131a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:8px;padding:8px 10px 18px;font-weight:700;font-size:16px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13.5px;margin-bottom:2px;}
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}
  .main{flex:1;padding:22px 28px;overflow-x:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  h1{font-size:20px;margin:0;}
  .sub{color:var(--muted);font-size:13px;margin-top:3px;}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .btn.danger{background:var(--red);color:#fff;border-color:var(--red);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .card .k{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .card .v{font-size:22px;font-weight:700;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel h3{margin:0 0 12px;font-size:15px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.blue{background:var(--blue-bg);color:var(--blue);}
  .badge.amber{background:var(--amber-bg);color:var(--amber);}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .grow{flex:1;}
  input[type=text],input[type=number],input[type=file],select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;}
  textarea{width:100%;min-height:150px;resize:vertical;}
  label.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .kcol{min-width:190px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;}
  .kcol h4{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .kcard{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;}
  .kcard b{display:block;font-size:12.5px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:var(--panel);border-radius:12px;padding:24px;max-width:560px;width:92%;border:1px solid var(--border);max-height:88vh;overflow-y:auto;}
  .modal h2{margin-top:0;font-size:17px;}
  .pill-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .pill{padding:6px 12px;border-radius:20px;font-size:12.5px;border:1px solid var(--border);cursor:pointer;color:var(--muted);}
  .pill.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .draft-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12.5px;white-space:pre-wrap;line-height:1.5;}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;}
  .small{font-size:11.5px;color:var(--muted);}
  .compliance-banner{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}
  ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body data-theme="light">
<div class="app">
  <div class="sidebar">
    <div class="brand"><span class="dot"></span> Getlux CRM</div>
    <div id="nav"></div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
      <div class="toggle" onclick="toggleTheme()">🌓 Toggle dark / light</div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ---------------- STORAGE HELPERS ----------------
   This demo.html is a standalone, self-contained page deployed on GitHub
   Pages (not a Claude.ai artifact) — localStorage is used deliberately
   here so LinkedIn Data numbers and template edits persist between visits
   in the visitor's own browser. Nothing is ever sent to a server. */
const LS_LINKEDIN_DATA = "getlux_demo_linkedin_data_v1";
const LS_TEMPLATES = "getlux_demo_templates_v1";
const LS_CONTACTS = "getlux_demo_contacts_v1";

// A single named window target reused for every LinkedIn profile we open —
// clicking "profile", "Message", or "Connect on LinkedIn" for different
// contacts navigates this one tab instead of piling up a new tab each time.
const LINKEDIN_TAB_TARGET = "getluxLinkedInTab";

function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage unavailable — demo still works in-memory */ }
}

/* ---------------- TEMPLATES ---------------- */
const INVITATION_NOTE_CHAR_LIMIT = 300;

const DEFAULT_CONNECTION_TEMPLATES = [

{id:"template-3",type:"Connection Message",name:"Template 3",body:"{{GREETING}}\n\nI came across your collections role at {{COMPANY}}.\n\nGetlux helps lending and NBFC businesses strengthen their collection operations through pan-India tele-calling support. We have 150+ trained collection callers and offices across Bangalore, Tamil Nadu, and Kerala.\n\nOur experience includes supporting organizations such as IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nIf you are exploring collection-agency support for {{COMPANY}}, I can share our profile and service details.\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-4",type:"Connection Message",name:"Template 4",body:"{{GREETING}}\n\nYour experience in collections at {{COMPANY}} caught my attention.\n\nGetlux is a collection-support partner for NBFCs and lenders, running pan-India tele-calling operations with 150+ trained callers from offices in Bangalore, Tamil Nadu, and Kerala.\n\nWe've worked with organizations like IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nHappy to send over our profile if it's relevant for {{COMPANY}}.\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-5",type:"Connection Message",name:"Template 5",body:"{{GREETING}}\n\nNoticed you lead collections-related work at {{COMPANY}}.\n\nAt Getlux, we support NBFCs, banks, and fintechs with pan-India tele-calling collections — 150+ trained tele-callers, offices in Bangalore, Tamil Nadu, and Kerala.\n\nOrganizations we support include IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nLet me know if a quick profile share would be useful for {{COMPANY}}.\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-6",type:"Connection Message",name:"Template 6",body:"{{GREETING}}\n\nCame across your collections/recovery profile at {{COMPANY}}.\n\nGetlux provides pan-India tele-calling collection support for NBFCs and lenders, with 150+ trained callers across offices in Bangalore, Tamil Nadu, and Kerala.\n\nWe currently support IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nWould you be open to a short profile share for {{COMPANY}}?\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-7",type:"Connection Message",name:"Template 7",body:"{{GREETING}}\n\nYour work in collections at {{COMPANY}} stood out.\n\nGetlux supports lending and NBFC businesses with tele-calling and field-collection capacity — 150+ trained callers, offices in Bangalore, Tamil Nadu, and Kerala.\n\nReference clients include IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nHappy to share more details if useful for {{COMPANY}}.\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-8",type:"Connection Message",name:"Template 8",body:"{{GREETING}}\n\nI see you're involved in collections at {{COMPANY}}.\n\nGetlux runs pan-India tele-calling collections for NBFCs and financial-service companies, with 150+ trained tele-callers and offices in Bangalore, Tamil Nadu, and Kerala.\n\nWe support names like IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nOpen to sharing our company profile if relevant for {{COMPANY}}.\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-9",type:"Connection Message",name:"Template 9",body:"{{GREETING}}\n\nYour collections background at {{COMPANY}} caught my eye.\n\nGetlux is a tele-calling collections partner to NBFCs and lenders across India — 150+ trained callers, offices in Bangalore, Tamil Nadu, and Kerala.\n\nWe currently work with IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nWould a short profile overview be useful for {{COMPANY}}?\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
{id:"template-10",type:"Connection Message",name:"Template 10",body:"{{GREETING}}\n\nSaw your role handling recovery/collections at {{COMPANY}}.\n\nGetlux offers pan-India tele-calling collection support for NBFCs and lending businesses — 150+ trained callers, offices across Bangalore, Tamil Nadu, and Kerala.\n\nOur client base includes IDFC Bank, KreditBee, Navi Finserv, Payrupik, Nira Finance, Moneyview, Kissht, and Groww.\n\nLet me know if it's worth a quick conversation for {{COMPANY}}.\n\nRegards,\nSabari – Getlux\n+91 6363958868 | Business@getlux.co.in | www.getlux.co.in"},
];

const DEFAULT_INVITATION_TEMPLATES = [
{id:"invite-1",type:"Invitation Note",name:"Invitation 1 — collections/recovery support",body:"{{GREETING}} I support NBFCs and lenders with collections and recovery services at Getlux. Would love to connect and share how we might help {{COMPANY}}."},
{id:"invite-2",type:"Invitation Note",name:"Invitation 2 — tele-calling collections partner",body:"{{GREETING}} Noticed your work in collections/recovery. I'm with Getlux, a pan-India tele-calling collections partner for NBFCs and lenders. Open to connecting?"},
{id:"invite-3",type:"Invitation Note",name:"Invitation 3 — short introduction",body:"{{GREETING}} I'm Sabari from Getlux — we help NBFCs and lenders with pan-India collections support. Would be great to connect with you."},
];

let templates = lsGet(LS_TEMPLATES, null) || [...DEFAULT_CONNECTION_TEMPLATES, ...DEFAULT_INVITATION_TEMPLATES];
function saveTemplates(){ lsSet(LS_TEMPLATES, templates); }
function templatesOfType(type){ return templates.filter(t => t.type === type); }

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

const QUAL_KEYWORDS =["collection","collections","recovery","debt recovery","loan recovery","legal recovery","field collections","tele-calling collections","receivables","accounts receivable","delinquency","credit","credit operations","lending","nbfc","bank","banking","financial services","finance operations","loan servicing","repayment","risk collections","payment recovery","asset recovery"];

function isQualified(role, company){
  const hay = (role+" "+company).toLowerCase();
  const hit = QUAL_KEYWORDS.find(k=>hay.includes(k));
  return hit ? {qualified:true, reason:"Matched keyword: \""+hit+"\""} : {qualified:false, reason:"No qualifying keyword found"};
}

function greeting(pronouns){
  // Explicit-pronoun-only rule: "Hi Sir," ONLY if pronoun field is
  // explicitly He/Him, "Hi Ma'am," ONLY if explicitly She/Her, otherwise
  // generic "Hello," — never inferred from a person's name.
  if(pronouns==="He/Him") return "Hi Sir,";
  if(pronouns==="She/Her") return "Hi Ma'am,";
  return "Hello,";
}
function renderTemplate(tpl, greetingText, company){
  return tpl.body.split("{{GREETING}}").join(greetingText).split("{{COMPANY}}").join(company);
}
function templateTypeFor(contact){
  return contact.connectionStatus === "Connected" ? "Connection Message" : "Invitation Note";
}

/* ---------------- CONTACTS (seed data) ---------------- */
// 5th column is a LinkedIn profile URL, used only to open a normal browser
// tab for the human to click LinkedIn's own "Connect" button themselves
// (see connectOnLinkedIn()) — never used to log in, scrape, or auto-click
// anything on linkedin.com. Two contacts are deliberately left without a
// URL to demonstrate the disabled "Connect on LinkedIn" state.
const rawContacts = [
 ["Contact A","Collections Manager","Bright Finserv NBFC","He/Him","https://www.linkedin.com/in/contact-a-bright-finserv"],
 ["Contact B","Regional Collection Head","Suvidha Capital","She/Her",null],
 ["Contact C","Software Engineer","Bright Finserv NBFC",null,"https://www.linkedin.com/in/contact-c-bright-finserv"],
 ["Contact D","Credit Operations Manager","Rupeeway Fintech",null,"https://www.linkedin.com/in/contact-d-rupeeway"],
 ["Contact E","Recovery Manager","Trustline NBFC","He/Him","https://www.linkedin.com/in/contact-e-trustline"],
 ["Contact F","HR Business Partner","Trustline NBFC",null,"https://www.linkedin.com/in/contact-f-trustline"],
 ["Contact G","Head of Collections","Suvidha Capital",null,"https://www.linkedin.com/in/contact-g-suvidha"],
 ["Contact H","Loan Recovery Officer","Kredence Bank","She/Her","https://www.linkedin.com/in/contact-h-kredence"],
 ["Contact I","Marketing Lead","Kredence Bank",null,"https://www.linkedin.com/in/contact-i-kredence"],
 ["Contact J","Field Collections Manager","Payzo Finance","He/Him","https://www.linkedin.com/in/contact-j-payzo"],
 ["Contact K","Banking Collections Manager","National Trust Bank",null,"https://www.linkedin.com/in/contact-k-national-trust"],
 ["Contact L","UX Designer","National Trust Bank",null,"https://www.linkedin.com/in/contact-l-national-trust"],
 ["Contact M","NBFC Operations Manager","Suvidha Capital","She/Her","https://www.linkedin.com/in/contact-m-suvidha"],
 ["Contact N","Legal Recovery Manager","Rupeeway Fintech",null,null],
 ["Contact O","Accounts Receivable Lead","Trustline NBFC",null,"https://www.linkedin.com/in/contact-o-trustline"],
];

function buildDefaultContacts(){
  return rawContacts.map((r,i)=>{
    const q = isQualified(r[1], r[2]);
    return {
      id:i+1, name:r[0], role:r[1], company:r[2], pronouns:r[3],
      linkedinUrl:r[4]||null,
      qualified:q.qualified, reason:q.reason,
      stage: q.qualified ? "Qualified" : "Skipped",
      connectionStatus: "Not Connected",
      templateId: null, message:null, messageStatus:"pending", // pending | copied | sent
      sentAt:null, reply:null, existingConv:false, connectHintShown:false, connectError:null,
    };
  });
}

let contacts = lsGet(LS_CONTACTS, null) || buildDefaultContacts();
function saveContacts(){ lsSet(LS_CONTACTS, contacts); }
let nextContactId = Math.max(0, ...contacts.map(c=>c.id)) + 1;

/* ---------------- LINKEDIN DATA (manual entry, localStorage) ---------------- */
const STALE_DAYS = 7;
let linkedinData = lsGet(LS_LINKEDIN_DATA, {
  totalConnections: 0, pendingSent: 0, pendingReceived: 0, lastUpdated: null,
});
function saveLinkedInData(totalConnections, pendingSent, pendingReceived){
  linkedinData = {
    totalConnections: Number(totalConnections)||0,
    pendingSent: Number(pendingSent)||0,
    pendingReceived: Number(pendingReceived)||0,
    lastUpdated: new Date().toISOString(),
  };
  lsSet(LS_LINKEDIN_DATA, linkedinData);
  render();
}
function daysSince(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function isLinkedInDataStale(){
  const d = daysSince(linkedinData.lastUpdated);
  return d === null || d > STALE_DAYS;
}

/* ---------------- STATE ---------------- */
let theme = "light";
let currentPage = "dashboard";
let complianceAccepted = false;
let templatesTab = "Connection Message";
let importState = { headers: null, rows: null, detected: false, connectionStatus: "Not Connected", summary: null, error: null };

const pages = ["dashboard","linkedin","import","contacts","batch","pipeline","campaigns","templates","settings"];
const pageLabels = {
  dashboard:"📊 Dashboard", linkedin:"🔗 LinkedIn Data", import:"📥 Import CSV", contacts:"👥 Contacts",
  batch:"✉️ Batch Review & Send", pipeline:"🗂 Pipeline (Kanban)",
  campaigns:"🎯 Campaigns", templates:"📝 Templates", settings:"⚙️ Settings"
};

function toggleTheme(){
  theme = theme==="light" ? "dark" : "light";
  document.body.setAttribute("data-theme", theme);
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = pages.map(p=>
    `<div class="nav-item ${p===currentPage?'active':''}" onclick="go('${p}')">${pageLabels[p]}</div>`
  ).join("");
}
function go(p){ currentPage=p; render(); }

function stageBadge(stage){
  const map = {
    "Qualified":"blue","Verified":"blue","Verification Pending":"blue","Queued":"blue","Draft Ready":"blue","Approved":"blue",
    "Draft Copied — Awaiting Manual Send":"amber",
    "Outreach Sent":"green","Delivered / Sent Successfully":"green","Replied":"green","Interested":"green","Won":"green",
    "Follow-up Required":"amber","Skipped":"amber","Not Interested":"red","Failed":"red","Do Not Contact":"red","Lost":"red","Existing Conversation":"amber"
  };
  return `<span class="badge ${map[stage]||'blue'}">${stage}</span>`;
}
function connectionBadge(status){
  return `<span class="badge ${status==="Connected"?"green":"amber"}">${status}</span>`;
}

/* ---------------- PAGES ---------------- */
function renderDashboard(){
  const sentCount = contacts.filter(c=>c.messageStatus==="sent").length;
  const repliedCount = contacts.filter(c=>c.reply).length;
  const qualifiedCount = contacts.filter(c=>c.qualified).length;
  const skippedCount = contacts.filter(c=>c.stage==="Skipped").length;
  const replyRate = sentCount ? ((repliedCount/sentCount)*100).toFixed(1) : "0.0";
  const stale = isLinkedInDataStale();
  return `
  <div class="topbar"><div><h1>Dashboard</h1><div class="sub">Live metrics computed from current demo data</div></div></div>
  <div class="cards">
    <div class="card"><div class="k">Total Imported</div><div class="v">${contacts.length}</div></div>
    <div class="card"><div class="k">Qualified Contacts</div><div class="v">${qualifiedCount}</div></div>
    <div class="card"><div class="k">Messages Sent</div><div class="v">${sentCount}</div></div>
    <div class="card"><div class="k">Replies Received</div><div class="v">${repliedCount}</div></div>
    <div class="card"><div class="k">Reply Rate</div><div class="v">${replyRate}%</div></div>
    <div class="card"><div class="k">Skipped</div><div class="v">${skippedCount}</div></div>
    <div class="card"><div class="k">Follow-ups Due Today</div><div class="v">0</div></div>
    <div class="card"><div class="k">Won Opportunities</div><div class="v">0</div></div>
  </div>
  <div class="panel">
    <h3>LinkedIn Data ${stale ? '<span class="badge amber">Update your LinkedIn numbers</span>' : ''}</h3>
    <div class="small" style="margin-bottom:10px;">Manually entered on the LinkedIn Data screen — never scraped or pulled automatically.</div>
    <div class="cards" style="margin-bottom:0;">
      <div class="card"><div class="k">Total Connections</div><div class="v">${linkedinData.totalConnections}</div></div>
      <div class="card"><div class="k">Pending Sent Requests</div><div class="v">${linkedinData.pendingSent}</div></div>
      <div class="card"><div class="k">Pending Received Requests</div><div class="v">${linkedinData.pendingReceived}</div></div>
      <div class="card"><div class="k">Last Updated</div><div class="v" style="font-size:15px;">${linkedinData.lastUpdated ? new Date(linkedinData.lastUpdated).toLocaleDateString() : 'Never'}</div></div>
    </div>
  </div>
  <div class="panel">
    <h3>Pipeline stage distribution</h3>
    ${barChart()}
  </div>

const LINKEDIN_EXPORT_HEADERS = ["first name","last name","url","company","position","connected on"];
function detectLinkedInExportFormat(headers){
  const lower = headers.map(h=>h.trim().toLowerCase());
  return LINKEDIN_EXPORT_HEADERS.every(h=>lower.includes(h));
}
// Minimal CSV parser (handles quoted fields with embedded commas/quotes) —
// good enough for the small sample files this demo works with.
function parseCsv(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = "";
        if(row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }
  if(rows.length === 0) return { headers: [], data: [] };
  const headers = rows[0].map(h=>h.trim());
  const data = rows.slice(1).map(r=>{
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = (r[i]||"").trim(); });
    return obj;
  });
  return { headers, data };
}

function handleFileChosen(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const { headers, data } = parseCsv(String(e.target.result));
      const isLinkedInExport = detectLinkedInExportFormat(headers);
      importState = {
        filename: file.name, headers, rows: data,
        detected: isLinkedInExport,
        connectionStatus: isLinkedInExport ? "Connected" : "Not Connected",
        summary: null, error: null,
      };
      render();
    }catch(err){
      importState.error = "Could not parse this CSV file.";
      render();
    }
  };
  reader.readAsText(file);
}

// toOpenableLinkedInUrl: validates and normalizes a user-typed or
// CSV-sourced LinkedIn profile URL into a well-formed, absolute,
// directly-openable URL (protocol included) — mirrors
// shared/linkedinUrl.ts's toOpenableLinkedInUrl() in the Electron app.
// Returns null if empty, unparseable, or not a linkedin.com host.
function toOpenableLinkedInUrl(raw){
  if(!raw || typeof raw !== "string") return null;
  let candidate = raw.trim();
  if(!candidate) return null;
  if(!/^https?:\/\//i.test(candidate)){
    candidate = `https://${candidate}`;
  }
  let parsed;
  try{
    parsed = new URL(candidate);
  }catch(e){
    return null;
  }
  const host = parsed.hostname.toLowerCase();
  // Accept the main linkedin.com domain (incl. country subdomains like
  // in.linkedin.com) and lnkd.in — LinkedIn's own short-link domain, which
  // is what the mobile app's "Share profile" button generates.
  const isLinkedInHost = host.includes("linkedin.com") || host === "lnkd.in" || host.endsWith(".lnkd.in");
  if(!isLinkedInHost) return null;
  return parsed.toString();
}
const LINKEDIN_URL_ERROR = "Enter a valid LinkedIn profile URL, e.g. https://www.linkedin.com/in/your-handle";

function findHeader(headers, needle){
  return headers.find(h=>h.trim().toLowerCase()===needle) || headers.find(h=>h.trim().toLowerCase().includes(needle));
}

function runImport(){
  if(!importState.rows) return;
  const headers = importState.headers;
  const urlCol = findHeader(headers, "url") || findHeader(headers, "linkedin");
  const firstCol = findHeader(headers, "first name");
  const lastCol = findHeader(headers, "last name");
  const fullCol = findHeader(headers, "full name") || findHeader(headers, "name");
  const companyCol = findHeader(headers, "company");
  const positionCol = findHeader(headers, "position") || findHeader(headers, "title");
  const connectedOnCol = findHeader(headers, "connected on");

  let imported=0, duplicates=0, invalid=0;
  const seenUrls = new Set(contacts.map(c=>c.linkedinUrl || ""));

  importState.rows.forEach(row=>{
    const url = urlCol ? row[urlCol] : "";
    let name = fullCol ? row[fullCol] : "";
    if(!name){
      name = `${firstCol ? row[firstCol] : ""} ${lastCol ? row[lastCol] : ""}`.trim();
    }
    const company = companyCol ? row[companyCol] : "";
    const position = positionCol ? row[positionCol] : "";
    if(!name || !url){ invalid++; return; }
    const openableUrl = toOpenableLinkedInUrl(url);
    if(!openableUrl){ invalid++; return; }
    const normalized = openableUrl.trim().toLowerCase().replace(/\/+$/,"");
    if(seenUrls.has(normalized)){ duplicates++; return; }
    seenUrls.add(normalized);
    const q = isQualified(position, company);
    contacts.push({
      id: nextContactId++, name, role: position, company, pronouns: null,
      linkedinUrl: openableUrl,
      qualified: q.qualified, reason: q.reason,
      stage: q.qualified ? "Qualified" : "Imported",
      connectionStatus: importState.connectionStatus,
      templateId: null, message: null, messageStatus: "pending",
      sentAt: null, reply: null, existingConv: false,
      connectedOn: connectedOnCol ? row[connectedOnCol] : null,
      connectHintShown: false, connectError: null,
    });
    imported++;
  });

  importState.summary = { imported, duplicates, invalid, total: importState.rows.length };
  saveContacts();
  render();
}

// Per-row action button for the Contacts table — this is where the former
// standalone "Qualified Queue" and "Verification Queue" screens' single
// actions now live, one action per contact depending on its current stage.
// Nothing here ever talks to linkedin.com; "Run Mock Verification" is a
// pure in-browser simulation, same as the mock-mode Electron app.
function contactStageAction(c){
  let html = '';
  // Verification is only meaningful for prospects not yet connected on
  // LinkedIn — someone already Connected has no need to go through it.
  const notConnected = c.connectionStatus !== "Connected";
  if(notConnected && c.stage === "Qualified"){
    html += `<button class="btn primary" onclick="sendToVerification(${c.id})">Send to Verification</button> `;
  }
  if(notConnected && c.stage === "Verification Pending"){
    const busy = verifyBusyId === c.id;
    html += `<button class="btn primary" ${busy?'disabled':''} onclick="runMockVerification(${c.id})">${busy?'Verifying…':'Run Mock Verification'}</button> `;
  }
  const msgBusy = messageBusyId === c.id;
  html += `<button class="btn" ${msgBusy?'disabled':''} onclick="messageContact(${c.id})" title="Copies an auto-drafted message and opens this contact's LinkedIn profile — you paste and click Send/Connect yourself">${msgBusy?'Opening…':'Message'}</button>`;
  if(c.messageHintShown){
    html += `<div class="small" style="margin-top:4px;">Message copied — paste it on LinkedIn, then click Send/Connect there yourself.</div>`;
  }
  if(c.messageError){
    html += `<div class="small" style="color:#dc2626;margin-top:4px;">${escapeHtml(c.messageError)}</div>`;
  }
  return html || '<span class="small">—</span>';
}

// "Message" action — auto-drafts the correct template (Invitation Note if
// not yet connected, Connection Message if already connected), copies it to
// the clipboard, and opens the contact's LinkedIn profile in a new tab. This
// NEVER logs into LinkedIn, never scrapes it, and never clicks anything on
// linkedin.com itself — the human pastes the message and clicks Send/Connect
// there themselves. Reuses the exact same draftMessageFor()/copy logic as
// Batch Review & Send, just triggerable directly from this table too.
let messageBusyId = null;
const MESSAGE_ERROR_LINKEDIN = "Couldn't open LinkedIn — this contact's profile URL looks invalid. Click Edit to fix it.";
async function messageContact(id){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  c.messageError = null;
  c.messageHintShown = false;
  const openableUrl = toOpenableLinkedInUrl(c.linkedinUrl || '');
  if(!openableUrl){
    c.messageError = MESSAGE_ERROR_LINKEDIN;
    saveContacts();
    render();
    return;
  }
  // Open the tab synchronously, in the same tick as the click, so mobile
  // browsers keep this tied to the user's tap instead of treating it as a
  // blocked popup. That's also what lets the OS hand off a linkedin.com /
  // lnkd.in link to the LinkedIn app itself (via its universal link) rather
  // than opening it in the in-app browser — if window.open() ran after an
  // `await`, most mobile browsers would silently block it or fall back to a
  // plain browser tab instead.
  const win = window.open('', LINKEDIN_TAB_TARGET, 'noopener');
  messageBusyId = id;
  render();
  try{
    const { text } = draftMessageFor(c);
    const finalText = c.message || text;
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(finalText);
    }
    c.message = finalText;
    c.messageStatus = "copied";
    c.stage = "Draft Copied — Awaiting Manual Send";
    if(win){ win.location = openableUrl; } else { window.open(openableUrl, LINKEDIN_TAB_TARGET, 'noopener'); }
    c.messageHintShown = true;
  }catch(e){
    c.messageError = MESSAGE_ERROR_LINKEDIN;
    if(win) win.close();
  }
  messageBusyId = null;
  saveContacts();
  render();
}

function sendToVerification(id){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  c.stage = "Verification Pending";
  saveContacts();
  render();
}

// Run Mock Verification — mirrors the Electron app's mock-mode
// verification (electron/services/verification.ts): simulates checking
// current company/title and message availability, no real request is ever
// made to linkedin.com. Mostly succeeds ("Verified"); occasionally
// simulates a block reason, matching the real mock adapter's behavior.
let verifyBusyId = null;
function runMockVerification(id){
  verifyBusyId = id;
  render();
  setTimeout(()=>{
    const c = contacts.find(x=>x.id===id);
    if(c){
      if(Math.random() < 0.85){
        c.stage = "Verified";
      } else {
        c.stage = "Skipped";
        c.reason = "Current employer could not be verified. Contact skipped.";
      }
      saveContacts();
    }
    verifyBusyId = null;
    render();
  }, 500);
}

function renderBatch(){

  const sentCount = q.filter(c=>c.messageStatus==="sent").length;
  return `
    <div class="topbar"><div><h1>Batch Review & Send</h1><div class="sub">Copy each draft and paste it into LinkedIn yourself — nothing sends automatically</div></div></div>
    <div class="compliance-banner">🔒 For each contact, the correct draft type is auto-selected — an <b>Invitation Note</b> if not yet connected, or a <b>Connection Message</b> if already connected. Click <b>Copy to Clipboard</b>, paste and send it yourself inside your own LinkedIn tab, then click <b>Mark as Sent</b> — that is the ONLY way a contact is ever recorded as sent.</div>
    <div class="panel">
      <h3>Drafts (${q.length} total — ${copiedCount} copied, ${sentCount} marked sent)</h3>
      ${q.map(c=>{
        const { template, text } = draftMessageFor(c);
        if(c.templateId === null) c.templateId = template ? template.id : null;
        const msg = c.message || text;
        const options = templatesOfType(templateTypeFor(c));
        return `
        <div class="panel" style="margin-bottom:10px;">
          <div class="row">
            <b>${escapeHtml(c.name)}</b>
            <span class="small">${escapeHtml(c.role)} @ ${escapeHtml(c.company)}</span>
            ${connectionBadge(c.connectionStatus)}
            <span class="badge blue">${templateTypeFor(c)}</span>
            <select onchange="changeBatchTemplate(${c.id}, this.value)">
              ${options.map(t=>`<option value="${t.id}" ${t.id===c.templateId?'selected':''}>${t.name}</option>`).join("")}
            </select>
            ${c.messageStatus==="copied" ? '<span class="badge amber">Draft Copied — Awaiting Manual Send</span>' : ''}
            ${c.messageStatus==="sent" ? '<span class="badge green">Marked as Sent</span>' : ''}
          </div>
          <div class="draft-box" contenteditable="true" oninput="editDraft(${c.id}, this.innerText)">${escapeHtml(msg)}</div>
          <div class="row" style="margin-top:8px;">
            <button class="btn primary" onclick="copyDraftToClipboard(${c.id})">Copy to Clipboard</button>
            ${c.connectionStatus === "Not Connected" ? `
            <button class="btn" ${!c.linkedinUrl ? "disabled" : ""}
              title="${!c.linkedinUrl ? "Add a LinkedIn profile URL for this contact first" : "Copies the invitation note, then opens this contact's LinkedIn profile in a new tab"}"
              onclick="connectOnLinkedIn(${c.id})">Connect on LinkedIn</button>` : ''}
            <button class="btn" ${c.messageStatus==="sent"?"disabled":""} onclick="markDraftSent(${c.id})" title="Click only after you've actually sent this on LinkedIn yourself">
              ${c.messageStatus==="sent" ? "Sent ✓" : "Mark as Sent"}
            </button>
          </div>
          ${c.connectHintShown ? '<div class="small" style="margin-top:6px;">Note copied — paste it in the invite dialog on LinkedIn, then click Connect there yourself.</div>' : ''}
          ${c.connectError ? `<div class="small" style="margin-top:6px;color:var(--red);">${escapeHtml(c.connectError)}</div>` : ''}
        </div>`;
      }).join("")}
    </div>`;
}
function changeBatchTemplate(id, templateId){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  c.templateId = templateId;
  c.message = null;
  render();
}
function editDraft(id, text){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  c.message = text;
  // Don't re-render on every keystroke (would steal focus) — just store it.
}
async function copyDraftToClipboard(id){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  const { text } = draftMessageFor(c);
  const finalText = c.message || text;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(finalText);
    }
  }catch(e){ /* clipboard permissions vary by browser — draft is still shown for manual copy */ }
  c.message = finalText;
  c.messageStatus = "copied";
  c.stage = "Draft Copied — Awaiting Manual Send";
  saveContacts();
  render();
}
// Copies the drafted Invitation Note to the clipboard (reusing the exact
// same copy logic as "Copy to Clipboard"), then opens the contact's
// LinkedIn profile URL in a normal new browser tab for the human to click
// LinkedIn's own "Connect" button and paste the note themselves. This
// NEVER logs into LinkedIn, never scrapes it, and never clicks anything on
// linkedin.com itself — it only opens a tab, exactly like clicking a link.
const CONNECT_ERROR_MESSAGE = "Couldn't open LinkedIn — this contact's profile URL looks invalid. Edit it from Contacts.";
async function connectOnLinkedIn(id){
  const c = contacts.find(x=>x.id===id);
  if(!c || !c.linkedinUrl) return;
  // Defensive re-normalization: contacts created before this fix may
  // still have a protocol-less or otherwise malformed URL stored.
  const openableUrl = toOpenableLinkedInUrl(c.linkedinUrl);
  if(!openableUrl){
    c.connectError = CONNECT_ERROR_MESSAGE;
    saveContacts();
    render();
    return;
  }
  // Same fix as messageContact(): open synchronously, in direct response to
  // the click, so the tab stays tied to the user's tap and the OS can hand
  // linkedin.com / lnkd.in links off to the LinkedIn app itself instead of
  // the browser blocking the popup or falling back to a plain browser tab.
  const win = window.open('', LINKEDIN_TAB_TARGET, 'noopener');
  try{
    await copyDraftToClipboard(id);
    if(win){ win.location = openableUrl; } else { window.open(openableUrl, LINKEDIN_TAB_TARGET, 'noopener'); }
    c.connectHintShown = true;
    c.connectError = null;
  }catch(e){
    c.connectError = CONNECT_ERROR_MESSAGE;
    if(win) win.close();
  }
  saveContacts();
  render();
}
function markDraftSent(id){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  const { text } = draftMessageFor(c);
  c.message = c.message || text;
  c.messageStatus = "sent";
  c.stage = "Outreach Sent";
  c.sentAt = new Date().toISOString();
  // Small illustrative touch so the Pipeline/Dashboard screens have
  // something to show — a random subset of "sent" demo contacts get a
  // simulated reply. This is cosmetic demo flavor only, not a real send.
  if(Math.random() < 0.35){
    c.reply = "Interested — please share your company profile.";
    c.stage = "Replied";
  }
  saveContacts();
  render();
}

function renderPipeline(){
  const stages = ["Qualified","Draft Copied — Awaiting Manual Send","Outreach Sent","Replied","Interested","Follow-up Required","Won","Skipped"];
  return `
  <div class="topbar"><div><h1>Pipeline — Kanban</h1><div class="sub">Live view of every contact's current CRM stage</div></div></div>
  <div class="kanban">
    ${stages.map(s=>`
      <div class="kcol"><h4>${s} (${contacts.filter(c=>c.stage===s).length})</h4>
        ${contacts.filter(c=>c.stage===s).map(c=>`<div class="kcard"><b>${escapeHtml(c.name)}</b>${escapeHtml(c.company)}</div>`).join("") || '<div class="small">—</div>'}
      </div>`).join("")}
  </div>`;
}

function renderCampaigns(){
  const names = ["August Collections Outreach","NBFC Decision Makers","Banking Collections Leads","Recovery Managers Campaign","Kerala Field Collections Leads","Tamil Nadu Collections Leads","Karnataka Collections Leads"];
  const sent = contacts.filter(c=>c.messageStatus==="sent").length;
  const replied = contacts.filter(c=>c.reply).length;
  return `
  <div class="topbar"><div><h1>Campaigns</h1></div></div>
  <div class="panel"><table><thead><tr><th>Campaign</th><th>Sent</th><th>Replies</th><th>Reply rate</th></tr></thead>
  <tbody>${names.map((n,i)=>`<tr><td>${n}</td><td>${i===0?sent:0}</td><td>${i===0?replied:0}</td><td>${i===0 && sent ? ((replied/sent)*100).toFixed(0)+'%':'—'}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------------- TEMPLATES (editable, type tabs) ---------------- */
function renderTemplates(){
  const list = templatesOfType(templatesTab);
  return `
  <div class="topbar"><div><h1>Templates</h1><div class="sub">${templates.length} templates — edits are saved to your browser</div></div></div>
  <div class="small" style="margin-bottom:12px;">
    Two template types: <b>Invitation Note</b> (for prospects not yet connected — LinkedIn caps invite notes at
    roughly ${INVITATION_NOTE_CHAR_LIMIT} characters, so keep these short) and <b>Connection Message</b> (for
    prospects you're already connected to). Both use {{GREETING}} and {{COMPANY}} placeholders.
  </div>
  <div class="pill-tabs">
    <div class="pill ${templatesTab==='Connection Message'?'active':''}" onclick="templatesTab='Connection Message';render();">Connection Message</div>
    <div class="pill ${templatesTab==='Invitation Note'?'active':''}" onclick="templatesTab='Invitation Note';render();">Invitation Note</div>
  </div>
  ${list.map(t=>{
    const overLimit = templatesTab==='Invitation Note' && t.body.length > INVITATION_NOTE_CHAR_LIMIT;
    return `<div class="panel">
      <div class="row" style="margin-bottom:8px;">
        <h3 style="margin:0;">${t.name}</h3>
        <span class="badge ${overLimit?'red':'blue'}">${t.body.length} chars${templatesTab==='Invitation Note' ? ' / '+INVITATION_NOTE_CHAR_LIMIT+' limit':''}</span>
      </div>
      <textarea id="tpl-${t.id}" oninput="editTemplateBody('${t.id}', this.value)">${t.body}</textarea>
      <div class="small" style="margin-top:6px;">Preview: ${escapeHtml(renderTemplate(t, 'Hello,', '[Company]'))}</div>
    </div>`;
  }).join("")}`;
}
function editTemplateBody(id, value){
  const t = templates.find(x=>x.id===id);
  if(!t) return;
  t.body = value;
  saveTemplates();
  // Re-render just the char-count badge without losing textarea focus:
  // simplest reliable approach for this vanilla-JS demo is a light re-render.
  const el = document.getElementById(`tpl-${id}`);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById(`tpl-${id}`);
  if(el2 && pos !== null){ el2.focus(); el2.setSelectionRange(pos, pos); }
}

function renderSettings(){
  return `
  <div class="topbar"><div><h1>Settings</h1></div></div>
  <div class="panel">
    <h3>Compliance</h3>
    <div class="small">"Use this tool only for relevant, legitimate, and policy-compliant business outreach. You are responsible for message content, consent, and compliance with LinkedIn policies and applicable laws."</div>
    <div class="small" style="margin-top:8px;">LinkedIn connection data is entered manually or imported from LinkedIn's own official data-export tool — this app never logs into LinkedIn or scrapes it. Every message is drafted for you to copy and paste yourself; nothing is ever sent automatically.</div>
  </div>
  <div class="panel">
    <h3>Sender details</h3>
    <div class="small">Sabari — Getlux · +91 6363958868 · Business@getlux.co.in · www.getlux.co.in</div>
  </div>
  <div class="panel">
    <h3>Reset demo data</h3>
    <div class="small" style="margin-bottom:8px;">Clears contacts, template edits, and LinkedIn Data saved in this browser's local storage.</div>
    <button class="btn danger" onclick="resetDemoData()">Reset demo data</button>
  </div>`;
}
function resetDemoData(){
  if(!confirm("Reset all demo data saved in this browser? This cannot be undone.")) return;
  localStorage.removeItem(LS_LINKEDIN_DATA);
  localStorage.removeItem(LS_TEMPLATES);
  localStorage.removeItem(LS_CONTACTS);
  contacts = buildDefaultContacts();
  templates = [...DEFAULT_CONNECTION_TEMPLATES, ...DEFAULT_INVITATION_TEMPLATES];
  linkedinData = { totalConnections: 0, pendingSent: 0, pendingReceived: 0, lastUpdated: null };
  nextContactId = Math.max(0, ...contacts.map(c=>c.id)) + 1;
  render();
}

function render(){
  renderNav();
  const main = document.getElementById("main");
  const renderers = {
    dashboard:renderDashboard, linkedin:renderLinkedInPage, import:renderImport, contacts:renderContacts,
    batch:renderBatch, pipeline:renderPipeline, campaigns:renderCampaigns,
    templates:renderTemplates, settings:renderSettings,
  };
  main.innerHTML = renderers[currentPage]();
  renderModal();
}

function renderModal(){
  const root = document.getElementById("modalRoot");
  if(!complianceAccepted){
    root.innerHTML = `
    <div class="modal-bg"><div class="modal">
      <h2>Before you begin</h2>
      <p style="font-size:13.5px;line-height:1.5;">Use this tool only for relevant, legitimate, and policy-compliant business outreach. You are responsible for message content, consent, and compliance with LinkedIn policies and applicable laws.</p>
      <p class="small">This is a demo build. All "sending" shown here is a manual copy-to-clipboard action that you confirm yourself — no message is ever sent from this demo automatically.</p>
      <p class="small">LinkedIn connection data is entered manually by you, or imported from LinkedIn's own official data-export tool (Settings &amp; Privacy → Data Privacy → Get a copy of your data) — this demo never logs into LinkedIn or scrapes it.</p>
      <button class="btn primary" onclick="acceptCompliance()">I Understand — Continue</button>
    </div></div>`;
    return;
  }
  if(addConnectionOpen || editingContactId !== null){
    root.innerHTML = renderAddConnectionModal();
    return;
  }
  root.innerHTML = "";
}
function acceptCompliance(){ complianceAccepted = true; render(); }

render();
</script>
